# Codex uses Orchestrator (Carbon) through agy; other writers retain Astra.
# No scheduled effort overrides: Orchestrator takes none; Astra uses its medium pin.
schema_version = 1

[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "medium"

[reviewers.carbon]
cli = "agy"
model = "gemini-pro-orchestrator"

[routes]
claude = ["astra"]
codex = ["carbon"]
gemini = ["astra"]

[schedule]
completion_order = "last"
max_low_rounds = 32
max_repair_cycles = 33
severity_stop_after = 0

[schedule.plan]
lenses = ["plan"]

[[schedule.rounds]]
lenses = ["adversarial"]

[schedule.rotation]
lenses = ["consistency", "quality", "integration", "source-defect", "design", "optimization", "record", "plan-delivery"]

[schedule.escalation]
lenses = ["adversarial"]

[schedule.completion]
