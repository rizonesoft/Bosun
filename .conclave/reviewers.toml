# Claude and Antigravity write; Codex Astra alone reviews.
# Medium initial/completion reviews and low follow-ups.
schema_version = 1

[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "medium"

[routes]
claude = ["astra"]
gemini = ["astra"]

[schedule]
completion_order = "last"
max_low_rounds = 32
max_repair_cycles = 33
severity_stop_after = 0

[schedule.plan]
effort = "medium"
lenses = ["plan"]

[[schedule.rounds]]
effort = "medium"
lenses = ["adversarial"]

[schedule.rotation]
effort = "low"
lenses = ["consistency", "quality", "integration", "source-defect", "design", "optimization", "record", "plan-delivery"]

[schedule.escalation]
effort = "low"
lenses = ["adversarial"]

[schedule.completion]
effort = "medium"
