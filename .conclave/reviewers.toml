# One writer and one reviewer per section. Historical receipts replay their original pin.
# Same shape as Steward's pin of 2026-11-06: plan medium, adversarial medium, up to eight low rounds, completion medium
# last. Codex is reviewed by Carbon (Gemini 4 Carbon, owner decision 2026-11-12); other writers by Astra.
# Claude is never a reviewer.
schema_version = 1

[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "medium"

[reviewers.carbon]
cli = "agy"
model = "gemini-4-carbon-medium"
models_by_effort = { low = "gemini-4-carbon-low", medium = "gemini-4-carbon-medium" }

[routes]
claude = ["astra"]
codex = ["carbon"]
gemini = ["astra"]

[schedule]
completion_order = "last"
max_low_rounds = 32
max_repair_cycles = 33
severity_stop_after = 0

[schedule.plan]
effort = "medium"
lenses = ["plan"]

[[schedule.rounds]]
effort = "medium"
lenses = ["adversarial"]

[schedule.rotation]
effort = "low"
lenses = ["consistency", "quality", "integration", "source-defect", "design", "optimization", "record", "plan-delivery"]

[schedule.escalation]
effort = "low"
lenses = ["adversarial"]

[schedule.completion]
effort = "medium"
