name: build

# Builds the native tools and runs the tests that need no WSL distro. A change to only the plan or
# Markdown builds nothing new, so GitHub skips this run when every changed file matches.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'todo/**'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'todo/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a run still going: the gate only ever proves the branch's head (scripts/ci_status.py), and
# a run queued behind an older one's waited up to 11 minutes before it started (2026-11-16).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two Windows jobs side by side: one after another the script tests took 14 of the one job's 18 minutes
  # (2026-11-16). The build's own job takes the build-tool tests, the other the rest, balanced by that day's step
  # times (about 10 and 11 minutes); two, not more, so the run costs few more minutes than one (the owner's choice).
  windows:
    name: Build and test on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The .NET SDK global.json pins (11.0.100, no prerelease), for the solution and tests/dotnet_nodes_test.ps1.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # The icon packages tests\start_run_test.ps1 renders each shortcut's badge with, as plan.yml installs them.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Icon generator packages
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-icons.txt
      - name: Build
        run: pwsh scripts\build.ps1
      - name: .NET SDK in use
        run: dotnet --version
      - name: Build the .NET solution
        run: dotnet build Bosun.slnx -nologo -maxCpuCount:2
      - name: .NET tests
        run: dotnet test --solution Bosun.slnx --no-build
      # Built so it can't rot, never run here: the smoke presses real keys on a desktop (D02 T02 §10).
      - name: Build the end-to-end smoke
        run: dotnet build tests/Bosun.Panel.E2E -nologo -maxCpuCount:2
      - name: Language standard of every compile
        run: python scripts\native-std-check.py
      - name: Hardening of every built image
        run: python scripts\native-pe-check.py build\Release
      - name: Core tests
        run: build\Release\test_core.exe
      - name: Core test names
        run: pwsh tests\core_names_test.ps1
      - name: Instances test
        run: pwsh tests\instances_test.ps1
      - name: Editor window reporter test
        run: pwsh tests\editor_extension_test.ps1
      - name: Report floor test
        run: pwsh tests\report_test.ps1
      - name: Start script test
        run: pwsh tests\start_run_test.ps1
      - name: Build output test
        run: pwsh tests\bin_output_test.ps1
      - name: Build cache test
        run: pwsh tests\build_cache_test.ps1
      - name: Build measurement test
        run: pwsh tests\measure_build_test.ps1
      - name: Developer environment cache test
        run: pwsh tests\dev_env_test.ps1
      - name: Build script test
        run: pwsh tests\build_script_test.ps1
      - name: LSP plugin check test
        run: pwsh tests\setup_lsp_test.ps1
      - name: Swap install test
        run: pwsh tests\swap_file_test.ps1

  scripts:
    name: Script tests on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Icon generator packages
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-icons.txt
      - name: Build
        run: pwsh scripts\build.ps1
      - name: Build the .NET solution
        run: dotnet build Bosun.slnx -nologo -maxCpuCount:2
      - name: Preflight test
        run: pwsh tests\preflight_test.ps1
      - name: Queue tests
        run: pwsh tests\queue_test.ps1 -SkipWsl
      - name: Clone setup test
        run: pwsh tests\setup_clone_test.ps1
      - name: Overlay lookup test
        run: pwsh tests\overlay_test.ps1
      - name: Overlay clone and pull test
        run: pwsh tests\overlay_clone_test.ps1
      - name: Campaign admin setup test
        run: pwsh tests\campaign_admin_test.ps1
      - name: Campaign hold test
        run: pwsh tests\campaign_hold_test.ps1
      - name: Check-all gate test
        run: pwsh tests\check_all_test.ps1
      - name: No MSBuild node outlives a .NET build
        run: pwsh tests\dotnet_nodes_test.ps1
      - name: Page renders are written whole or not at all
        run: pwsh tests\render_pages_test.ps1

  # The desktop's script tests, apart from the others so each job stays well inside its time limit and the two run at
  # once: the scripts job reached its 20 minutes on 2026-11-18 with every step passed, and was cancelled.
  desktop-scripts:
    name: Desktop script tests on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build
        run: pwsh scripts\build.ps1
      - name: Build the .NET solution
        run: dotnet build Bosun.slnx -nologo -maxCpuCount:2
      - name: Window capture self-test
        run: pwsh tests\capture_window_test.ps1
      # The runner's test runs one fixture test of the smoke under a holder's lock (it sends no input): the smoke is
      # built for it here, as the build job builds it.
      - name: Build the end-to-end smoke
        run: dotnet build tests/Bosun.Panel.E2E -nologo -maxCpuCount:2
      - name: Real-input smoke runner test
        run: pwsh tests\smoke_input_test.ps1

  linux:
    name: Test the WSL side on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Logger tests
        run: python3 -B tests/test_bosun_log.py
      - name: Shell scripts parse
        run: |
          for f in wsl/bosun wsl/*.sh; do bash -n "$f" || exit 1; done
