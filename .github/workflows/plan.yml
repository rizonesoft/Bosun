name: plan

# The TODO graph is the execution plan: a malformed graph or a stale generated plan fails CI like any other defect.
# It runs on every change, with no path list: the Python suite here reads the reviewer pin, the skill mirrors, the
# prompt templates, the sources and the design files, and a list of those fell behind once (D00 T01 §7).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan-gates:
    name: Plan gates
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Stamp ancestry checks need real history, not a shallow checkout.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Icon generator packages
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-icons.txt
      - name: Validate the TODO tree
        run: python scripts/todo-graph.py validate
      - name: Check the generated plan is current
        run: python scripts/todo-graph.py plan --check
      - name: Tooling tests
        run: python scripts/run-tests.py
      - name: Agent tiers
        run: node scripts/verify-agent-tiers.mjs

  # The whole public history scanned for secrets on every push to main and every pull request, with the guard's own
  # scanner (D00 T05 §6): this workflow has no path list, so a push of only docs or plan files is scanned too. CI never
  # sees the private overlay, so the deny-list pass is skipped and said to be; the pre-push guard runs it locally.
  secrets:
    name: Secret scan of the full history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit of every branch and tag, not the pushed tip alone.
          fetch-depth: 0
      # gitleaks 8.30.1, the version the pre-push guard pins, its archive pinned by SHA-256 from that release's
      # gitleaks_8.30.1_checksums.txt, not read from the same release, so a replaced release fails here.
      - name: Install gitleaks 8.30.1
        run: |
          set -eu
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL -o "$dir/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - name: Scan every commit, tag and published file for secrets
        run: pwsh scripts/leak-scan.ps1 -All
      - name: Self-test that the same scan finds a secret only in history
        run: pwsh tests/ci/secret_history_selftest.ps1
