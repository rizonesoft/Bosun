name: plan

# The TODO graph is the execution plan: a malformed graph or a stale generated plan fails CI like any other defect.
# It runs on every change, with no path list: the Python suite here reads the reviewer pin, the skill mirrors, the
# prompt templates, the sources and the design files, and a list of those fell behind once (D00 T01 §7).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan-gates:
    name: Plan gates
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Stamp ancestry checks need real history, not a shallow checkout.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Icon generator packages
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-icons.txt
      - name: Validate the TODO tree
        run: python scripts/todo-graph.py validate
      - name: Check the generated plan is current
        run: python scripts/todo-graph.py plan --check
      - name: Tooling tests
        run: python scripts/run-tests.py
      - name: Agent tiers
        run: node scripts/verify-agent-tiers.mjs
