<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DevMode Panel mockup</title>
<style>
:root{--base:#0F1319;--surface:#161B23;--raised:#1D242E;--hover:#262E3A;--line:#2D3644;--text:#E8EDF3;--dim:#A3AEBD;--mute:#8592A4;--accent:#35D6A6;--accentdim:#16493C;--onaccent:#06221A;--ok:#46C96B;--warn:#FFB547;--danger:#FF6B5E;--info:#6EA8FF}
:root[data-theme=light]{--base:#F4F6F8;--surface:#FFF;--raised:#ECEFF3;--hover:#E2E7ED;--line:#CCD3DC;--text:#141A22;--dim:#465160;--mute:#5A6676;--accent:#0A7A5E;--accentdim:#CFEFE5;--onaccent:#FFF;--ok:#1B7A3D;--warn:#8F5A00;--danger:#C2281C;--info:#1F5FBF}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--base);color:var(--text);font:13px/1.45 "Segoe UI Variable Text","Segoe UI",sans-serif;display:grid;grid-template-rows:44px 1fr 132px;overflow:hidden}
.title{display:flex;align-items:center;gap:10px;padding:0 0 0 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.title svg{width:20px;height:20px}.title b{font-weight:600}.badge{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.spacer{flex:1}.cap{width:46px;height:44px;display:grid;place-items:center;color:var(--dim)}
.body{display:grid;grid-template-columns:208px 1fr;min-height:0}
nav{border-right:1px solid var(--line);background:var(--surface);padding:8px;overflow:auto}
nav h6{margin:12px 8px 4px;font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
nav button{display:block;width:100%;min-height:32px;text-align:left;background:none;border:0;color:var(--dim);font:inherit;padding:5px 10px;border-radius:6px;cursor:pointer}
nav button:hover{background:var(--hover);color:var(--text)}nav button[aria-current=page]{background:var(--accentdim);color:var(--text);font-weight:600}
main{padding:20px 24px;overflow:auto;min-width:0}
h1{font:600 21px "Segoe UI Variable Display","Segoe UI",sans-serif;margin:0}.sub{color:var(--dim);margin:2px 0 16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px;min-width:0}.grid .card{margin:0}
.card h2{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.05em;text-transform:uppercase}
.metric{font:600 28px "Segoe UI Variable Display","Segoe UI",sans-serif}.note{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:var(--mute);font-weight:600;text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border:0}
.n{text-align:right;font-variant-numeric:tabular-nums}.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12px}
.st{white-space:nowrap;font-weight:600}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--danger)}.info{color:var(--info)}
.btn{font:inherit;min-height:32px;padding:5px 14px;border-radius:6px;border:1px solid var(--line);background:var(--raised);color:var(--text);cursor:pointer;margin-right:6px}.btn:hover{background:var(--hover)}.btn.p{background:var(--accent);border-color:var(--accent);color:var(--onaccent);font-weight:600}.btn.d{color:var(--danger);border-color:var(--danger)}
.bar{height:10px;border-radius:5px;background:var(--raised);overflow:hidden;display:flex;margin:6px 0}.bar i{display:block;height:100%}
.spark{width:100%;height:120px;display:block}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
input,select,textarea{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:6px 9px}textarea{width:100%;min-height:96px}
.activity{border-top:1px solid var(--line);background:var(--surface);padding:6px 14px;overflow:auto;font:12px "Cascadia Mono",Consolas,monospace;color:var(--dim)}.activity b{font-weight:600}
.mock{color:var(--warn);border-color:var(--warn)}
@media (max-width:760px){body{overflow:auto;height:auto;display:block}.body{display:block}nav{border:0;display:flex;flex-wrap:wrap}nav h6{width:100%}nav button{width:auto}.activity{height:132px}table{display:block;overflow:auto}}
</style>
</head>
<body>
<header class="title">
<svg viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E2733"/><stop offset="1" stop-color="#0D1117"/></linearGradient></defs><rect width="24" height="24" rx="5" fill="url(#t)"/><polyline points="4.5,6 10.5,12 4.5,18" fill="none" stroke="#35D6A6" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round"/><rect x="13" y="7" width="8" height="3" rx="1" fill="#35D6A6"/><rect x="13" y="14" width="8" height="3" rx="1" fill="#FFB547"/></svg>
<b>DevMode Panel</b><span class="badge">Run active on DevMode</span><span class="badge mock">Mockup: sample data</span><span class="spacer"></span>
<button class="btn" id="theme" style="margin-right:8px">Light theme</button><span class="cap">&#8722;</span><span class="cap">&#9633;</span><span class="cap">&#10005;</span>
</header>
<div class="body"><nav id="nav" aria-label="Pages"></nav><main id="page" tabindex="-1"></main></div>
<section class="activity" aria-label="Activity" id="activity"></section>
<script>
const st=(c,w)=>`<span class="st ${c}">${w}</span>`;
const table=(h,r)=>`<table><thead><tr>${h.map(x=>`<th class="${x[0]=='#'?'n':''}">${x.replace('#','')}</th>`).join('')}</tr></thead><tbody>${r.map(c=>`<tr>${c.map((v,i)=>`<td class="${h[i][0]=='#'?'n':''}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const card=(t,b)=>`<div class="card"><h2>${t}</h2>${b}</div>`;
const metric=(t,v,n)=>card(t,`<div class="metric">${v}</div><div class="note">${n}</div>`);
const spark=`<svg class="spark" viewBox="0 0 800 120" preserveAspectRatio="none" role="img" aria-label="Available memory over 24 hours, lowest 1.5 GB at 14:20"><line x1="0" x2="800" y1="96" y2="96" stroke="var(--danger)" stroke-dasharray="5 5"/><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="0,40 60,44 120,38 180,62 240,70 300,52 360,48 420,86 460,102 500,84 560,60 620,56 680,72 740,64 800,58"/></svg>`;
const pages={
Overview:{g:'Monitor',s:'Is it safe to start more work, and what needs me?',b:()=>`<div class="grid">${metric('Windows available','7.4 GB','of 32 GB, lowest today 1.5 GB')}${metric('WSL guest available','5.1 GB','of 14 GB cap')}${metric('Queue','1 of 2 slots','Recto build, 4 min')}${metric('Dev instances','6 running','3 Windows, 3 WSL')}</div>${card('Needs you',table(['State','What','Where',''],[[st('warn','Waiting'),'D06 T01 §5 needs an owner decision','DevMode',`<button class="btn">Open</button>`],[st('bad','Stalled'),'Unattended run made no change across 3 restarts','Office',`<button class="btn">Open run</button>`],[st('info','Update'),'Codex CLI has a newer release','Windows',`<button class="btn">Review</button>`]]))}${card('Runs',table(['Repo','State','Ready','Verified','Heartbeat'],[['DevMode',st('ok','Active'),'9','12 of 64','6 min ago'],['Steward',st('warn','Drained'),'0','56 of 96','stopped'],['Recto',st('ok','Active'),'14','231 of 410','2 min ago']]))}`},
Memory:{g:'Monitor',s:'Live headroom, what is using it, and the peaks behind the 64 GB decision.',b:()=>`<div class="grid">${metric('Windows used','24.6 GB','Committed 38.2 GB, pagefile 32 to 50 GB')}${metric('WSL VM','11.8 GB','Cap 14 GB, guest available 5.1 GB')}${metric('Overlapping builds','3 today','Lowest headroom during overlap 1.5 GB')}</div>${card('Available memory, 24 hours',spark+'<div class="note">Dashed line: 2 GB pressure threshold. The same data is available as a table.</div><div class="row"><select aria-label="Range"><option>24 hours</option><option>7 days</option><option>14 days</option></select><button class="btn">Show as table</button></div>')}${card('By repo',table(['Repo','Side','#Private GB','#Peak GB','#Processes'],[['Recto','Windows','6.2','11.4','14'],['Isotone','Windows','3.1','7.0','9'],['Resolute','WSL','4.4','8.8','22'],['DevMode','Windows','0.9','1.6','5']]))}`},
Instances:{g:'Monitor',s:'Every agent, editor and build, on both sides, grouped by repo.',b:()=>card('Running now',table(['Instance','Repo','Side','State','#GB','Uptime',''],[['Claude Code 2.1.319','DevMode','Windows',st('ok','Working'),'0.7','22 min',`<button class="btn">Open folder</button>`],['Codex CLI 0.167.0','DevMode','Windows',st('info','Reviewing'),'0.4','3 min',`<button class="btn">Open folder</button>`],['Claude Code 2.1.319','Recto','Windows',st('warn','Idle'),'0.6','3 h',`<button class="btn">Open folder</button>`],['Claude Code 2.1.319','Resolute','WSL',st('ok','Working'),'0.8','41 min',`<button class="btn">Open folder</button>`]]))},
Queue:{g:'Monitor',s:'Heavy jobs taking turns across Windows and WSL.',b:()=>`${card('Slots',table(['Slot','Holder','Repo','Side','#Waited','#Running'],[['1','cmake --build build','Recto','Windows','0 s','4 min'],['2',st('ok','Free'),'','','','']]))}${card('Waiting',table(['Command','Repo','Side','#Waiting for','Why'],[['dotnet test','Isotone','Windows','1 min 20 s','Slot 2 needs 6 GB available, 4.9 GB now']]))}${card('Limits','<div class="row"><label>Slots <input value="2" size="2"></label><label>Second slot needs <input value="6144" size="6"> MB</label><label>Maximum wait <input value="900" size="5"> s</label><button class="btn p">Save</button></div>')}`},
Plan:{g:'Workflow',s:'The TODO graph for the selected repo, from todo-graph.py query plan.',b:()=>`<div class="row" style="margin-bottom:12px"><select aria-label="Repo"><option>DevMode</option><option>Steward</option><option>Recto</option><option>Office</option><option>Resolute</option></select><button class="btn">Graph view</button><button class="btn">Findings</button><button class="btn">Deferred</button></div><div class="grid">${metric('Verified','12','of 64 sections')}${metric('Ready','9','can run now')}${metric('Blocked','43','waiting on a section or Need')}</div>${card('Phase 2: Shell and brand',table(['Status','Section','Title','Needs','Rounds'],[[st('ok','Verified'),'D02 T01 §1','Theme tokens generate the XAML','none','3'],[st('ok','Verified'),'D02 T01 §3','Icon generator with a drift check','none','2'],[st('info','Ready'),'D02 T02 §4','Window chrome, rail and activity pane','none',''],[st('warn','Blocked'),'D02 T02 §10','End-to-end smoke through UI Automation','display-session','']]))}`},
Reviews:{g:'Workflow',s:'The pinned reviewer, every round and the receipts behind each stamp.',b:()=>`${card('Reviewer pin',table(['Writer','Reviewer','Model','CLI found','Schedule'],[['claude','astra','gpt-6-astra',st('ok','Yes'),'plan medium, adversarial medium, up to 8 low, completion medium'],['codex','argon','gemini-4-argon-medium',st('ok','Yes'),'same']]))}${card('Review in flight',table(['Section','Pass','Reviewer','#Elapsed','#Deadline'],[['D02 T02 §4','Round 2, consistency, low','astra','3 min','30 min']]))}${card('Recent receipts',table(['Section','Verdict','#Rounds','Completion','Commit'],[['D02 T01 §3',st('ok','Clean'),'2','complete','<span class="mono">a1b2c3d</span>'],['D02 T01 §1',st('ok','Fixed'),'3','complete','<span class="mono">9f8e7d6</span>']]))}`},
'Unattended run':{g:'Workflow',s:'Start, watch and stop process plan, with each catch shown separately.',b:()=>`<div class="grid">${metric('Run','Active','Session 8fab7f47, started 08:14')}${metric('Heartbeat','6 min ago','Next tick due in 9 min')}${metric('Watchdog','Installed','Last tick 4 min ago')}${metric('Restarts','0 of 3','Yields 0 of 3')}</div>${card('Controls',`<div class="row"><button class="btn p">Start process plan</button><button class="btn">Stop at end of turn</button><button class="btn d">Halt with a ground</button><button class="btn">Uninstall watchdog</button></div><div class="note" style="margin-top:8px">Start opens a Windows Terminal tab, and refuses beside a live session in this folder.</div>`)}${card('Guard log',`<div class="mono">08:29 watch: active session alive, nothing to do<br>08:22 heartbeat: renewed, 9 ready rows<br>08:14 start: session 8fab7f47 from prompt</div>`)}`},
'Hooks and automations':{g:'Workflow',s:'What actually fires, merged across user, project and local settings.',b:()=>`${card('Hooks',table(['Event','Command','Source','Script found'],[['Stop','run-guard.py hook','Project',st('ok','Yes')],['PreToolUse Bash|PowerShell','dispatch_hook.py','Project',st('ok','Yes')],['PreToolUse Write|Edit','layer_rules.py','User',st('ok','Yes')],['SessionStart','run-guard.py hook','Project',st('ok','Yes')]]))}${card('Scheduled automations',table(['Task','Trigger','Last run','Result',''],[['devmode-python-pin','Monday 07:00','Today 07:02',st('ok','Exit 0'),'<button class="btn">Run now</button>'],['devmode-visual-studio','Monday 07:05','Today 07:06',st('bad','Exit 1'),'<button class="btn">Open log</button>']]))}`},
Fleet:{g:'Workflow',s:'Which generation of the shared kit each repo runs. Read-only: ports stay deliberate.',b:()=>card('Kit generations',table(['Repo','Run guard','Dispatcher','Graph','Hooks','Remaining ports'],[['DevMode',st('ok','run-guard'),st('ok','Current'),st('ok','Current'),'7 events','none'],['Steward',st('ok','run-guard'),st('warn','No settled items'),st('ok','Current'),'6 events','2'],['Recto',st('warn','campaign_guard'),st('ok','Settled items'),st('ok','Current'),'2 events','1'],['Isotone',st('warn','campaign_guard'),st('warn','Older'),st('info','Text queries'),'2 events','4']]))},
Agents:{g:'Machine',s:'Installed agents on each side, with updates that wait for a free moment.',b:()=>`${card('Agents',table(['Agent','Side','Installed','Latest','Running',''],[['Claude Code','Windows','2.1.319','2.1.319','3',st('ok','Current')],['Codex CLI','Windows','0.167.0','0.168.0','1','<button class="btn">Update</button>'],['Antigravity CLI','Windows','1.9.2','1.9.2','0',st('ok','Current')],['Claude Code','WSL','2.1.317','2.1.319','1','<button class="btn">Update</button>'],['GitHub CLI','Windows','2.81.0','2.81.0','0',st('ok','Current')]]))}${card('Configuration checks',table(['Check','Result'],[['Commit attribution is empty',st('ok','Pass')],['Plan and review CLIs resolve',st('ok','Pass')],['API key in the environment of a session',st('ok','None')]]))}`},
Optimise:{g:'Machine',s:'Each change shows its evidence, previews, verifies and can be undone.',b:()=>card('Recommendations',table(['Finding','Evidence','Effect','Needs',''],[['RAM runs below its rating','2133 MHz, part number rates 3600','Faster builds','BIOS, you',st('info','Instructions')],['Pagefile on a fast drive','C: 32 to 50 GB',st('ok','Applied'),'','<button class="btn">Undo</button>'],['Startup apps','Discord, Creative Cloud off',st('ok','Applied'),'','<button class="btn">Undo</button>'],['Background memory priority','Waiting for 7 days of logs',st('warn','Not yet'),'',''],['Park idle repos','Waiting for 7 days of logs',st('warn','Not yet'),'','']]))},
Workbench:{g:'Claude API',s:'Extra development on your own API key. Counts toward the caps below.',b:()=>`${card('Budget',`<div class="row"><b>$4.12 of $20.00 today</b></div><div class="bar"><i style="width:21%;background:var(--accent)"></i></div><div class="note">$38.40 of $300.00 this month. A request that would pass a cap is refused before it is sent.</div>`)}${card('New task',`<div class="row"><select aria-label="Mode"><option>Overflow agent: Claude Code in a new worktree</option><option>Ask: one request, no tools</option></select><select aria-label="Repo"><option>DevMode</option><option>Recto</option></select><select aria-label="Model"><option>claude-opus-5-5</option><option>claude-sonnet-5-5</option><option>claude-haiku-5-5</option></select><select aria-label="Effort"><option>medium</option><option>high</option><option>low</option></select></div><p><textarea aria-label="Task">Run process plan on the DevMode worktree until the budget of $5 is spent.</textarea></p><button class="btn p">Start</button><span class="note">Key: stored, encrypted for this Windows user</span>`)}`},
Usage:{g:'Claude API',s:'Every request and agent run the panel paid for, from its own ledger.',b:()=>card('This month',table(['When','Mode','Repo','Model','#Input','#Cached','#Output','#Cost'],[['Today 09:12','Overflow','DevMode','claude-opus-5-5','184,201','1,402,118','22,410','$1.46'],['Today 08:40','Ask','Recto','claude-haiku-5-5','12,044','0','1,201','$0.00']]))},
Settings:{g:'App',s:'Every setting here has a named consumer.',b:()=>card('General',`<div class="row"><label><input type="checkbox" checked> Start with Windows, in the tray</label></div><div class="row"><label>Theme <select><option>Follow Windows</option><option>Dark</option><option>Light</option></select></label></div><div class="row"><label>Pressure alert below <input value="2048" size="6"> MB</label></div><div class="row"><button class="btn">Add repo</button><button class="btn">Scan R:\\GitHub</button></div>`)},
};
const nav=document.getElementById('nav'),main=document.getElementById('page');let group='';
for(const[k,v]of Object.entries(pages)){if(v.g!==group){group=v.g;nav.insertAdjacentHTML('beforeend',`<h6>${group}</h6>`)}const b=document.createElement('button');b.textContent=k;b.onclick=()=>show(k,b);nav.append(b)}
function show(k,b){[...nav.querySelectorAll('button')].forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');main.innerHTML=`<h1>${k}</h1><p class="sub">${pages[k].s}</p>${pages[k].b()}`;main.scrollTop=0}
const wanted=decodeURIComponent(location.hash.slice(1));const first=[...nav.querySelectorAll('button')].find(b=>b.textContent===wanted)||nav.querySelector('button');show(first.textContent,first);
document.getElementById('activity').innerHTML=['INFO 09:14 Panel ready, watching 7 repos','WARN 09:12 Office: unattended run stalled after 3 restarts','INFO 09:10 Recto took slot 1: cmake --build build'].map(x=>{const[a,...r]=x.split(' ');return`<div><b class="${a=='WARN'?'warn':'ok'}">${a}</b> ${r.join(' ')}</div>`}).join('');
const t=document.getElementById('theme');t.onclick=()=>{const l=document.documentElement.dataset.theme==='light';document.documentElement.dataset.theme=l?'dark':'light';t.textContent=l?'Light theme':'Dark theme'};
</script>
</body>
</html>
