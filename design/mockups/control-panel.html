*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--wall);background-attachment:fixed;color:var(--text);font:13px/1.45 "Segoe UI Variable Text","Segoe UI",sans-serif;display:grid;grid-template-rows:46px 1fr;overflow:hidden}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:-3px}

.logo{width:20px;height:20px}.title b{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--hover);color:var(--dim)}.chip.mock{color:var(--warn);background:var(--warnSoft)}

.spacer{flex:1}.kbtn{display:flex;align-items:center;gap:8px;width:280px;height:30px;padding:0 10px;border-radius:8px;background:var(--hover);border:1px solid var(--line);color:var(--mute);font:inherit;cursor:pointer}.kbtn:hover{border-color:var(--lineStrong)}.kbtn kbd{margin-left:auto}

.caps{display:flex;margin-left:6px}.cap{width:46px;height:46px;display:grid;place-items:center;color:var(--dim);border:0;background:none;cursor:pointer}.cap:hover{background:var(--hover);color:var(--text)}.cap.c:hover{background:#C42B1C;color:#fff}
.body{display:grid;grid-template-columns:224px 1fr;min-height:0}
nav{padding:6px 10px 14px;overflow:auto;position:relative}
nav h6{margin:14px 10px 4px;font-size:11px;font-weight:600;color:var(--mute)}

nav button:hover{background:var(--hover);color:var(--text)}nav button[aria-current=page]{background:var(--hover);color:var(--text);font-weight:600}nav button[aria-current=page] .ic{color:var(--accent)}
nav .count{margin-left:auto;font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center;background:var(--warnSoft);color:var(--warn)}
.repoPick{display:block;margin:0 0 6px;padding:0 2px}.repoPick select{width:100%;height:36px;cursor:pointer}.repoLine{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;font-size:12px;color:var(--dim)}.repoLine code{font-size:12px}.repoLine .ic{width:14px;height:14px}.side{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--hover);color:var(--text)}.side.wsl{background:var(--infoSoft);color:var(--info)}.marker{position:absolute;left:10px;width:3px;height:18px;border-radius:2px;background:var(--accent);transition:top .22s cubic-bezier(.2,.8,.2,1);pointer-events:none}

main{padding:22px 26px;overflow:auto;min-width:0}main:focus{outline:0}
.head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}.head>div{flex:1}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:12px}.two{display:grid;gap:12px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);margin-bottom:12px}.two .card,.grid .card{margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;min-width:0;box-shadow:var(--shadow),var(--shine);animation:rise .28s cubic-bezier(.2,.8,.2,1) both}
.card.lift{transition:transform .14s,border-color .14s}.card.lift:hover{transform:translateY(-1px);border-color:var(--lineStrong)}
@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.card h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:12px;font-weight:600;color:var(--dim)}.card h2 .ic{color:var(--mute)}.card h2 .r{margin-left:auto;font-weight:400;color:var(--mute);font-size:11px}
.metric{font:600 28px/1.15 "Segoe UI Variable Display","Segoe UI",sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.note{color:var(--dim);font-size:12px}
.spark{display:block;width:100%;height:34px;margin-top:8px}
table{width:100%;border-collapse:collapse}th{font-size:11px;color:var(--mute);font-weight:600;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border:0}tbody tr{transition:background .1s}tbody tr:hover{background:var(--hover)}.n{text-align:right;font-variant-numeric:tabular-nums}.mono{font-family:"Cascadia Mono",Consolas,monospace;font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px 2px 7px;border-radius:999px;white-space:nowrap}.pill .ic{width:13px;height:13px}.ok{color:var(--ok);background:var(--okSoft)}.warn{color:var(--warn);background:var(--warnSoft)}.bad{color:var(--danger);background:var(--dangerSoft)}.info{color:var(--info);background:var(--infoSoft)}.idle{color:var(--dim);background:var(--hover)}
.btn{display:inline-flex;align-items:center;gap:7px;font:inherit;font-weight:500;height:32px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--raised);color:var(--text);cursor:pointer;box-shadow:var(--shine);transition:background .12s,border-color .12s,transform .06s}.btn:hover{border-color:var(--lineStrong);background:var(--hover)}.btn:active{transform:scale(.985)}.btn.p{background:var(--accent);border-color:transparent;color:var(--onaccent);font-weight:600}.btn.p:hover{filter:brightness(1.08);background:var(--accent)}.btn.d{color:var(--danger);border-color:var(--danger);background:transparent}.btn.d:hover{background:var(--dangerSoft)}.btn.g{background:transparent;border-color:transparent;box-shadow:none;color:var(--dim)}.btn.g:hover{background:var(--hover);color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;padding:3px;gap:2px;border-radius:9px;background:var(--hover);border:1px solid var(--line)}.seg button{font:inherit;height:26px;padding:0 12px;border:0;border-radius:6px;background:none;color:var(--dim);cursor:pointer}.seg button[aria-pressed=true]{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.22)}

input,select,textarea{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:32px}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}textarea{width:100%;min-height:88px;resize:vertical}.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}label{color:var(--dim)}

.toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:8px;z-index:11}.toast{display:flex;gap:10px;align-items:flex-start;width:330px;padding:12px 14px;background:var(--surface);border:1px solid var(--lineStrong);border-radius:12px;box-shadow:var(--shadowHi);animation:rise .22s both}.toast .tile{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;flex:none}.toast b{display:block}

</style>

const spark=(pts,c='var(--accent)')=>{const w=200,h=34,mx=Math.max(...pts),mn=Math.min(...pts),p=pts.map((v,i)=>[i*w/(pts.length-1),h-3-(v-mn)/(mx-mn||1)*(h-6)]);const l=p.map(a=>a.map(n=>n.toFixed(1)).join(',')).join(' ');return`<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true"><polygon points="0,${h} ${l} ${w},${h}" fill="${c}" opacity=".12"/><polyline points="${l}" fill="none" stroke="${c}" stroke-width="1.7" vector-effect="non-scaling-stroke"/></svg>`};
const metric=(t,i,v,n,pts,c)=>`<div class="card lift"><h2>${ic(i)}${t}</h2><div class="metric">${v}</div><div class="note">${n}</div>${pts?spark(pts,c):''}</div>`;
const gauge=(pct,val,unit,label,c='var(--accent)')=>{const r=52,C=2*Math.PI*r*.75;return`<svg class="gauge" viewBox="0 0 128 128" role="img" aria-label="${label}: ${val} ${unit}"><g transform="rotate(135 64 64)" fill="none" stroke-width="10" stroke-linecap="round"><circle cx="64" cy="64" r="${r}" stroke="var(--hover)" stroke-dasharray="${C} 999"/><circle cx="64" cy="64" r="${r}" stroke="${c}" stroke-dasharray="${C*pct} 999"/></g><text class="v" x="64" y="66" text-anchor="middle">${val}</text><text class="u" x="64" y="84" text-anchor="middle">${unit}</text></svg>`};
const stack=(parts)=>`<div class="stack" role="img" aria-label="${parts.map(p=>p[0]+' '+p[1]+' GB').join(', ')}">${parts.map(p=>`<i style="width:${p[1]/32*100}%;background:${p[2]}"></i>`).join('')}</div><div class="legend">${parts.map(p=>`<span><i style="background:${p[2]}"></i>${p[0]} ${p[1]} GB</span>`).join('')}</div>`;

const prog=p=>`<div class="prog"><i style="width:${p}%"></i></div>`;

y stats</code>',`<span class="row" style="margin:0"><button class="btn">Copy</button><button class="btn">${ic('square-terminal')}Open in terminal</button></span>`]])+`<div class="row" style="margin:10px 0 0"><button class="btn g">Add a command</button></div>`,repo.side==='WSL'?'Bash in '+repo.d:'PowerShell')}${card('Guard log','terminal',`<div class="mono">08:29 watch: active session alive, nothing to do<br>08:22 heartbeat: renewed, 9 ready rows<br>08:14 start: session 8fab7f47 from prompt</div>`)}`},

};
const nav=document.getElementById('nav'),main=document.getElementById('page'),marker=document.getElementById('marker');let group='',timer;
const REPOS=[{n:'Bosun',side:'Windows',p:'D:\\GitHub\\Bosun'},{n:'Steward',side:'Windows',p:'R:\\GitHub\\Steward'},{n:'Recto',side:'Windows',p:'R:\\GitHub\\Recto'},{n:'Office',side:'Windows',p:'R:\\GitHub\\Office'},{n:'sample-api',side:'WSL',p:'~/code/sample-api',d:'Ubuntu'},{n:'sample-web',side:'WSL',p:'~/code/sample-web',d:'Ubuntu',off:1}];
let repo=REPOS[0],current='Overview';
const REPO_PAGES=['Plan','Reviews','Unattended run','Hooks and automations'];
const repoOpts=s=>`<optgroup label="${s}">`+REPOS.filter(r=>r.side===s).map(r=>`<option value="${r.n}"${r===repo?' selected':''}>${r.n}</option>`).join('')+'</optgroup>';
const repoLine=()=>`<div class="repoLine"><span class="side${repo.side==='WSL'?' wsl':''}">${repo.side}${repo.d?' '+repo.d:''}</span>${ic('folder-open')}<code>${repo.p}</code>${repo.off?st('warn','WSL not running')+`<button class="btn" onclick="toast('Starting WSL','Started on request. The panel never starts WSL just to poll it.','ok')">${ic('play')}Start WSL</button>`:''}</div>`;
window.pickRepo=n=>{repo=REPOS.find(r=>r.n===n);if(REPO_PAGES.includes(current))go(current)};
for(const[k,v]of Object.entries(pages)){if(v.g!==group){group=v.g;nav.insertAdjacentHTML('beforeend',`<h6>${group}</h6>`);if(group==='Workflow')nav.insertAdjacentHTML('beforeend',`<label class="repoPick"><select aria-label="Repo for the Workflow pages" onchange="pickRepo(this.value)">${repoOpts('Windows')}${repoOpts('WSL')}</select></label>`)}const b=document.createElement('button');b.innerHTML=ic(v.i)+`<span>${k}</span>`+(v.count?`<span class="count" aria-label="${v.count} need you">${v.count}</span>`:'');b.dataset.page=k;b.onclick=()=>go(k);nav.append(b)}
function go(k){current=k;const b=nav.querySelector(`[data-page="${k}"]`);nav.querySelectorAll('button').forEach(x=>x.removeAttribute('aria-current'));b.setAttribute('aria-current','page');marker.style.top=b.offsetTop+9+'px';const v=pages[k];main.innerHTML=head(k,v)+'<div class="sk"></div><div class="sk" style="height:220px"></div>';main.scrollTop=0;clearTimeout(timer);timer=setTimeout(()=>{main.innerHTML=head(k,v)+v.b()},140)}
const head=(k,v)=>`<div class="head"><div><h1>${k}</h1><p class="sub">${v.s}</p>${REPO_PAGES.includes(k)?repoLine():''}</div>${v.a?`<div style="flex:none;display:flex;gap:8px">${v.a()}</div>`:''}</div>`;
function toast(t,m,k='ok'){const e=document.createElement('div');e.className='toast';e.innerHTML=`<span class="tile ${S[k][0]}">${ic(S[k][1])}</span><span><b>${t}</b><span class="note">${m}</span></span>`;document.getElementById('toasts').append(e);setTimeout(()=>e.remove(),4500)}
const scrim=document.getElementById('scrim'),q=document.getElementById('q'),res=document.getElementById('res');let sel=0,items=[];
const ACTIONS=[['Start process plan','play','Unattended run'],['Stop at end of turn','pause','Unattended run'],['Check agents for updates','refresh-cw','Agents'],['Scan a folder for repos','folder-open','Settings'],['Export usage CSV','download','Usage']];
function draw(){const t=q.value.toLowerCase();items=[...Object.entries(pages).map(([k,v])=>[k,v.i,k,'Page']),...ACTIONS.map(a=>[a[0],a[1],a[2],'Action'])].filter(x=>x[0].toLowerCase().includes(t)).slice(0,9);sel=Math.min(sel,Math.max(0,items.length-1));res.innerHTML=items.length?items.map((x,i)=>`<li class="${i==sel?'on':''}" data-i="${i}">${ic(x[1])}${x[0]}<small>${x[3]}</small></li>`).join(''):'<li>Nothing matches</li>';res.querySelectorAll('[data-i]').forEach(l=>l.onclick=()=>pick(+l.dataset.i))}
function pick(i){const x=items[i];if(!x)return;close_();go(x[2])}function open_(){scrim.classList.add('on');q.value='';sel=0;draw();q.focus()}function close_(){scrim.classList.remove('on')}
document.getElementById('kbtn').onclick=open_;scrim.onclick=e=>{if(e.target===scrim)close_()};q.oninput=()=>{sel=0;draw()};
addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();open_()}if(!scrim.classList.contains('on'))return;if(e.key==='Escape')close_();if(e.key==='ArrowDown'){sel=Math.min(sel+1,items.length-1);draw();e.preventDefault()}if(e.key==='ArrowUp'){sel=Math.max(sel-1,0);draw();e.preventDefault()}if(e.key==='Enter')pick(sel)});
document.getElementById('activity').innerHTML=['INFO 09:14 Panel ready, watching 7 repos','WARN 09:12 Office: unattended run stalled after 3 restarts','INFO 09:10 Recto took slot 1: cmake --build build'].map(x=>{const[a,...r]=x.split(' ');return`<div><b class="${a=='WARN'?'w':'i'}">${a}</b> ${r.join(' ')}</div>`}).join('');
const t=document.getElementById('theme');const paint=()=>{const l=document.documentElement.dataset.theme==='light';t.innerHTML=ic(l?'moon':'sun')};paint();t.onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light';paint()};
const wanted=decodeURIComponent(location.hash.slice(1));go(pages[wanted]?wanted:'Overview');
</script>
